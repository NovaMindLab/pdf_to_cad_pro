<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - PDF to CAD Converter</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #111726;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --accent-glow: rgba(0, 242, 254, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #8e9bb2;
      --error-color: #ef4444;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    /* 自定义标题栏拖拽区 */
    .window-titlebar {
      height: 36px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }
    .titlebar-logo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }

    .login-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        radial-gradient(ellipse 60% 45% at 20% 15%, rgba(79, 172, 254, 0.12), transparent),
        radial-gradient(ellipse 55% 40% at 85% 85%, rgba(0, 242, 254, 0.1), transparent),
        var(--bg-primary);
    }
    .login-card {
      width: 380px;
      background: rgba(17, 23, 38, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 36px 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }
    .login-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
    .login-logo img { width: 56px; height: 56px; border-radius: 12px; box-shadow: 0 0 24px rgba(0, 242, 254, 0.35); }
    .login-title { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .login-subtitle { font-size: 12px; color: var(--text-muted); }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text-main);
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: rgba(142, 155, 178, 0.5); }
    .form-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px var(--accent-glow); }

    .login-error {
      display: none;
      font-size: 12px;
      color: var(--error-color);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .login-error.show { display: block; }

    .btn-login {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-sans);
      color: #090d16;
      background: var(--accent-gradient);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-footer { margin-top: 20px; text-align: center; font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="window-titlebar">
    <div class="titlebar-logo">
      <img src="assets/logo.png" alt="" width="18" height="18" style="border-radius:4px;">
      <span>PDF-to-CAD Studio</span>
    </div>
  </div>

  <div class="login-stage">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/icon.png" alt="Logo">
        <div class="login-title">PDF to CAD Converter</div>
        <div class="login-subtitle">请登录以继续使用</div>
      </div>

      <div class="login-error" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="input-username">用户名</label>
          <input class="form-input" id="input-username" type="text" autocomplete="username" placeholder="请输入用户名" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-password">密码</label>
          <input class="form-input" id="input-password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <button class="btn-login" id="btn-login" type="submit">登 录</button>
      </form>

      <div class="login-footer">3DCIM 运维平台账号登录</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btnLogin = document.getElementById('btn-login');
    const errorBox = document.getElementById('login-error');
    const inputUsername = document.getElementById('input-username');
    const inputPassword = document.getElementById('input-password');

    // 自动登录失败后重新打开登录窗口时，预填上次登录的用户名
    const prefillUsername = new URLSearchParams(window.location.search).get('u');
    if (prefillUsername) {
      inputUsername.value = prefillUsername;
      inputPassword.focus();
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = inputUsername.value.trim();
      const password = inputPassword.value;
      if (!username) { showError('请输入用户名'); inputUsername.focus(); return; }
      if (!password) { showError('请输入密码'); inputPassword.focus(); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = '登录中...';
      try {
        const res = await window.api.loginWithPassword(username, password);
        if (res && res.success) {
          btnLogin.textContent = '登录成功';
          // 主进程收到登录成功事件后会打开主窗口并关闭本窗口
        } else {
          showError((res && res.error) || '登录失败，请检查用户名和密码');
          btnLogin.disabled = false;
          btnLogin.textContent = '登 录';
          inputPassword.focus();
          inputPassword.select();
        }
      } catch (err) {
        showError('登录异常：' + (err.message || err));
        btnLogin.disabled = false;
        btnLogin.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
